[package]
name = "oxvba-build"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Clean OxVBA build target orchestration and wrapper artifact generation."

[dependencies]
oxvba-bind.workspace = true
oxvba-com.workspace = true
oxvba-diagnostics.workspace = true
oxvba-oxir.workspace = true
oxvba-project.workspace = true
oxvba-symbol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
