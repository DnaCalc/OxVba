name: ci

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt
        run: cargo fmt --all --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo test
        run: cargo test --workspace
      - name: Cargo check
        run: cargo check --workspace

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core docs exist
        run: |
          test -f CHARTER.md
          test -f OPERATIONS.md
          test -f MACH1000_PLAN.md
          test -f README.md

  windows-conformance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Meta check (fast)
        shell: pwsh
        run: ./scripts/meta-check.ps1 -Fast
      - name: Smoke run
        shell: pwsh
        run: ./scripts/run-smoke.ps1
      - name: MVP conformance run
        shell: pwsh
        run: ./scripts/run-conformance.ps1
      - name: MVP matrix gate
        shell: pwsh
        run: ./scripts/run-matrix.ps1
