name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    name: windows-ready
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Meta check (fast, no artifacts)
        shell: pwsh
        run: ./scripts/meta-check.ps1 -Fast -NoArtifacts

  linux-ready:
    name: linux-ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Meta check (fast, no artifacts)
        shell: pwsh
        run: ./scripts/meta-check.ps1 -Fast -NoArtifacts

  macos-ready:
    name: macos-ready
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Meta check (fast, no artifacts)
        shell: pwsh
        run: ./scripts/meta-check.ps1 -Fast -NoArtifacts

  wasm-hal-ready:
    name: wasm-hal-ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: HAL conformance on wasm32/WASI
        shell: pwsh
        run: ./scripts/run-hal-conformance-wasm32.ps1 -SkipTests -OutputDir temp/no-artifacts/hal_wasm32_ci

  extended:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: windows-extended
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Meta check (extended, no artifacts)
        shell: pwsh
        run: ./scripts/meta-check.ps1 -Fast -Conformance -Matrix -Formal -NoArtifacts

  formal-kani:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_KANI == '1' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup Kani
        shell: pwsh
        run: ./scripts/setup-kani.ps1 -Install
      - name: Formal obligations (Kani required)
        shell: pwsh
        run: ./scripts/run-formal.ps1 -RequireKani
