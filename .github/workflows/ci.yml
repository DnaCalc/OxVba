name: ci

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    name: windows-ready
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Meta check (fast, no artifacts)
        shell: pwsh
        run: ./scripts/meta-check.ps1 -Fast -NoArtifacts

  extended:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: windows-extended
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Meta check (extended, no artifacts)
        shell: pwsh
        run: ./scripts/meta-check.ps1 -Fast -Conformance -Matrix -Formal -NoArtifacts

  formal-kani:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.RUN_KANI == '1' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Setup Kani
        shell: pwsh
        run: ./scripts/setup-kani.ps1 -Install
      - name: Formal obligations (Kani required)
        shell: pwsh
        run: ./scripts/run-formal.ps1 -RequireKani
