[workspace]
members = [
    "crates/oxvba-diagnostics",
    "crates/oxvba-hal",
    "crates/oxvba-syntax",
    "crates/oxvba-runtime",
    "crates/oxvba-jit",
    "crates/oxvba-com",
    "crates/oxvba-comhost",
    "crates/oxvba-host",
    "crates/oxvba-build",
    "crates/oxvba-cli",
    "crates/oxvba-project",
    "crates/oxvba-bundle",
    "crates/oxvba-lib",
    "crates/oxvba-symbol",
    "crates/oxvba-bind",
    "crates/oxvba-oxir",
    "crates/oxvba-eval",
    "crates/oxvba-vm3",
    "crates/oxvba-differential",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["DNA Kode"]
repository = "https://github.com/DnaCalc/OxVba"

# CI runs `cargo clippy --workspace --all-targets -- -D warnings`, so every
# warn-level lint here is build-blocking. Ratchet lints (documented below)
# start at "allow" and are flipped to enforcing as review waves close.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
# Wave-1 exit ratchet (flipped 2026-06-10): every unsafe block carries a
# `// SAFETY:` comment stating the invariant that makes it sound; sites where
# the invariant could not be fully established are marked
# `SAFETY: ASSUMPTION —` for the next review pass.
undocumented_unsafe_blocks = "deny"
# Ratchet: flipped to "warn" at review-campaign end, after production
# unwrap sites are classified (kept invariants become expect/INVARIANT).
unwrap_used = "allow"

[workspace.dependencies]
oxvba-syntax = { path = "crates/oxvba-syntax" }
oxvba-diagnostics = { path = "crates/oxvba-diagnostics" }
oxvba-hal = { path = "crates/oxvba-hal" }
oxvba-runtime = { path = "crates/oxvba-runtime" }
oxvba-jit = { path = "crates/oxvba-jit" }
oxvba-com = { path = "crates/oxvba-com" }
oxvba-comhost = { path = "crates/oxvba-comhost" }
oxvba-host = { path = "crates/oxvba-host" }
oxvba-build = { path = "crates/oxvba-build" }
oxvba-project = { path = "crates/oxvba-project" }
oxvba-bundle = { path = "crates/oxvba-bundle" }
oxvba-lib = { path = "crates/oxvba-lib" }
oxvba-symbol = { path = "crates/oxvba-symbol" }
oxvba-bind = { path = "crates/oxvba-bind" }
oxvba-oxir = { path = "crates/oxvba-oxir" }
oxvba-eval = { path = "crates/oxvba-eval" }
oxvba-vm3 = { path = "crates/oxvba-vm3" }
oxvba-differential = { path = "crates/oxvba-differential" }
rkyv = "0.8"
quick-xml = "0.37"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
