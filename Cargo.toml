[workspace]
members = [
    "crates/oxvba-hal",
    "crates/oxvba-syntax",
    "crates/oxvba-runtime",
    "crates/oxvba-compiler",
    "crates/oxvba-vm",
    "crates/oxvba-jit",
    "crates/oxvba-com",
    "crates/oxvba-host",
    "crates/oxvba-debug",
    "crates/oxvba-cli",
    "crates/oxvba-launcher",
    "crates/oxvba-project",
    "crates/oxvba-build",
    "crates/oxvba-languageservice",
    "crates/oxvba-lsp",
    "crates/oxvba-web-host",
    "crates/oxvba-web-shell",
    "crates/oxvba-bundle",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["DNA Kode"]
repository = "https://github.com/DnaCalc/OxVba"

[workspace.dependencies]
oxvba-syntax = { path = "crates/oxvba-syntax" }
oxvba-hal = { path = "crates/oxvba-hal" }
oxvba-runtime = { path = "crates/oxvba-runtime" }
oxvba-compiler = { path = "crates/oxvba-compiler" }
oxvba-vm = { path = "crates/oxvba-vm" }
oxvba-jit = { path = "crates/oxvba-jit" }
oxvba-com = { path = "crates/oxvba-com" }
oxvba-host = { path = "crates/oxvba-host" }
oxvba-debug = { path = "crates/oxvba-debug" }
oxvba-project = { path = "crates/oxvba-project" }
oxvba-build = { path = "crates/oxvba-build" }
oxvba-languageservice = { path = "crates/oxvba-languageservice" }
oxvba-web-host = { path = "crates/oxvba-web-host" }
oxvba-web-shell = { path = "crates/oxvba-web-shell" }
oxvba-bundle = { path = "crates/oxvba-bundle" }
rkyv = "0.8"
quick-xml = "0.37"
thiserror = "2"
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
