[package]
name = "oxvba-debug"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
tokio = ["dep:tokio"]
proptest = ["dep:proptest"]
bench = ["dep:criterion"]

[dependencies]
oxvba-host.workspace = true
oxvba-hal.workspace = true
oxvba-vm.workspace = true
oxvba-runtime.workspace = true
oxvba-compiler.workspace = true
crossbeam-channel = "0.5"
serde.workspace = true
thiserror.workspace = true
static_assertions = "1"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros"], optional = true }
proptest = { workspace = true, optional = true }
criterion = { version = "0.5", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Com", "Win32_Foundation"] }

[dev-dependencies]
serde_json.workspace = true

[[bench]]
name = "handle_latency"
harness = false
required-features = ["bench"]
